name: Build mod
on:
  push:
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: unzip -q *.zip
      - working-directory: visuals
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: visuals-mod
          path: visuals/build/libs/*.jar
      - name: Save jar into repo (dist/)
        run: |
          mkdir -p dist
          J=$(ls visuals/build/libs/*.jar | grep -v -e sources -e dev | head -1)
          cp "$J" dist/visuals-mod.jar
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/visuals-mod.jar
          git commit -m "Build jar" || exit 0
          git push
